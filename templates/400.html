{% extends 'base.html' %}
{% block title %}Bad Request — {{ journal.name }}{% endblock %}

{% block content %}
<div style="
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  padding: var(--spacing-12) var(--spacing-6);
  text-align: center;
">

  <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
       stroke="var(--color-muted)" stroke-width="1.4"
       stroke-linecap="round" stroke-linejoin="round"
       aria-hidden="true" style="margin-bottom: var(--spacing-6);">
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" y1="8" x2="12" y2="12"/>
    <line x1="12" y1="16" x2="12.01" y2="16"/>
  </svg>

  <p style="
    font-family: var(--font-sans);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--color-muted);
    margin-bottom: var(--spacing-3);
  ">400 — Bad Request</p>

  <h1 style="
    font-family: var(--font-serif);
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 400;
    color: var(--color-text);
    margin-bottom: var(--spacing-4);
    max-width: 42ch;
    line-height: var(--leading-snug);
  ">The server could not process this request.</h1>

  <p style="
    font-family: var(--font-sans);
    font-size: var(--size-sm);
    color: var(--color-muted);
    max-width: 52ch;
    margin-bottom: var(--spacing-8);
    line-height: var(--leading-normal);
  ">The request was malformed or contained invalid data. Try again from the beginning.</p>

  <div style="display: flex; gap: var(--spacing-3); flex-wrap: wrap; justify-content: center;">
    <a href="javascript:history.back()" class="btn btn--ghost">Go back</a>
    <a href="{% url 'home' %}" class="btn btn--secondary">Go to homepage</a>
  </div>

</div>
{% endblock %}
