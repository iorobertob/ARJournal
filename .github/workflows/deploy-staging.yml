name: Deploy — Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to staging
    runs-on: self-hosted          # executes directly on the VPS — no SSH needed
    environment: staging

    steps:
      - name: Pull latest code
        run: |
          cd ${{ vars.STAGING_PATH }}
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd ${{ vars.STAGING_PATH }}
          source venv/bin/activate
          pip install -q -r requirements/production.txt

      - name: Collect static files
        run: |
          cd ${{ vars.STAGING_PATH }}
          source venv/bin/activate
          python manage.py collectstatic --noinput

      - name: Run migrations
        run: |
          cd ${{ vars.STAGING_PATH }}
          source venv/bin/activate
          python manage.py migrate --noinput

      - name: Restart services
        run: |
          sudo systemctl restart transact-staging-gunicorn
          sudo systemctl restart transact-staging-celery

      - name: Done
        run: |
          cd ${{ vars.STAGING_PATH }}
          git log -1 --format="✓ Deployed: %h — %s"
