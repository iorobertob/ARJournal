name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm production deployment'
        required: true

jobs:
  guard:
    name: Confirm
    runs-on: ubuntu-latest        # lightweight check — runs on GitHub's infra
    steps:
      - name: Check confirmation input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Confirmation input was not 'deploy' — aborting."
            exit 1
          fi

  deploy:
    name: Deploy to production
    runs-on: self-hosted          # executes directly on the VPS — no SSH needed
    needs: guard
    environment: production       # add required reviewers in GitHub Settings for extra safety

    # Set the repo variable PRODUCTION_PATH to /var/www/inact in
    # GitHub → Settings → Secrets and variables → Actions → Variables.
    steps:
      - name: Pull latest code
        run: |
          cd ${{ vars.PRODUCTION_PATH }}
          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: |
          cd ${{ vars.PRODUCTION_PATH }}
          source venv/bin/activate
          pip install -q -r requirements/production.txt

      - name: Collect static files
        run: |
          cd ${{ vars.PRODUCTION_PATH }}
          source venv/bin/activate
          python manage.py collectstatic --noinput

      - name: Run migrations
        run: |
          cd ${{ vars.PRODUCTION_PATH }}
          source venv/bin/activate
          python manage.py migrate --noinput

      - name: Restart services
        run: |
          sudo systemctl restart inact-gunicorn
          sudo systemctl restart inact-celery
          sudo systemctl restart inact-celerybeat

      - name: Done
        run: |
          cd ${{ vars.PRODUCTION_PATH }}
          git log -1 --format="✓ Deployed: %h — %s"
