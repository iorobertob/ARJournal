# inAct Journal — Nginx config for PRODUCTION (bare-metal)
# Domain: https://inact.lmta.lt
# App dir: /var/www/inact
# Deploy: sudo cp nginx/nginx-production.conf /etc/nginx/sites-available/inact
#         sudo ln -sf /etc/nginx/sites-available/inact /etc/nginx/sites-enabled/
#         sudo nginx -t && sudo systemctl reload nginx
# (scripts/deploy.sh does all of the above automatically on first deploy.)

upstream django_prod {
    server 127.0.0.1:5002;
}

server {
    listen 80;
    server_name inact.lmta.lt www.inact.lmta.lt;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name inact.lmta.lt www.inact.lmta.lt;

    # SSL — managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/inact.lmta.lt/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inact.lmta.lt/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Static files (served directly by Nginx after collectstatic)
    location /static/ {
        alias /var/www/inact/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Video / audio / HLS are NOT publicly downloadable. This `internal` location
    # is only reachable via X-Accel-Redirect from the signed streaming view
    # (apps/production/views.py :: stream_media) — a direct request returns 404.
    # Nginx serves the bytes (with Range support) once Django has authorized.
    location ~* ^/media/(?<mediafile>.+\.(?:m3u8|ts|m4s|mp4|mov|webm|mkv|mp3|wav|flac|aac|m4a|ogg))$ {
        internal;
        alias /var/www/inact/media/$mediafile;
        types {
            application/vnd.apple.mpegurl m3u8;
            video/mp2t ts;
        }
        add_header Cache-Control "private, max-age=3600";
    }

    # Public media (images, PDFs, manuscripts) — served directly.
    location /media/ {
        alias /var/www/inact/media/;
        expires 7d;
    }

    # Django application
    location / {
        proxy_pass http://django_prod;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 500M;
    }

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "same-origin";
}
