<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Error — Trans/Act</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #f4f3ef;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .bar {
      height: 3px;
      background: #E86B1F;
    }
    .page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 1.5rem;
      text-align: center;
    }
    .label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 0.75rem;
    }
    h1 {
      font-family: 'Source Serif 4', Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 400;
      color: #1A1A1A;
      max-width: 42ch;
      line-height: 1.35;
      margin-bottom: 1rem;
    }
    p {
      font-size: 0.875rem;
      color: #888;
      max-width: 52ch;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    a {
      display: inline-block;
      padding: 0.6rem 1.25rem;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.15s, color 0.15s;
    }
    .btn-primary {
      background: #E86B1F;
      color: #fff;
      border: 1px solid #E86B1F;
    }
    .btn-primary:hover { background: #cf5c18; border-color: #cf5c18; }
    .btn-ghost {
      background: transparent;
      color: #555;
      border: 1px solid #d0cec8;
    }
    .btn-ghost:hover { background: #eceae4; }
    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.75rem;
      color: #aaa;
      border-top: 1px solid #e0ddd7;
    }
  </style>
</head>
<body>
  <div class="bar"></div>

  <div class="page">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"
         stroke="#bbb" stroke-width="1.4"
         stroke-linecap="round" stroke-linejoin="round"
         aria-hidden="true" style="margin-bottom:1.5rem;">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>

    <p class="label">500 — Server Error</p>

    <h1>Something went wrong on our end.</h1>

    <p>We encountered an unexpected error while processing your request.
       Our team has been notified. Please try again in a moment.</p>

    <div class="actions">
      <a href="javascript:history.back()" class="btn-ghost">Go back</a>
      <a href="{% url 'home' %}" class="btn-primary">Go to homepage</a>
    </div>
  </div>

  <footer>Trans/Act: Journal of Artistic Research</footer>
</body>
</html>
